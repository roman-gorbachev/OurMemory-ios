name: OurMemory
options:
  bundleIdPrefix: com.gorman
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: 12.8.0
targets:
  OurMemory:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App.debug.xcconfig
      Release: Config/App.release.xcconfig
    sources:
      - path: OurMemory
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gorman.ourmemory
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: OurMemory/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: OurMemory/App/OurMemory.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Register Google Sign-In URL scheme
        basedOnDependencyAnalysis: false
        script: |
          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          CONFIG="${SRCROOT}/OurMemory/Resources/GoogleService-Info.plist"
          [ -f "$CONFIG" ] || exit 0
          SCHEME=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" "$CONFIG")
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $SCHEME" "$PLIST"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseDatabase
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Nuke
        product: NukeUI
      - package: Nuke
        product: Nuke
  OurMemoryTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Tests.debug.xcconfig
      Release: Config/Tests.release.xcconfig
    sources:
      - OurMemoryTests
    dependencies:
      - target: OurMemory
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OurMemory.app/OurMemory
schemes:
  OurMemory:
    build:
      targets:
        OurMemory: all
        OurMemoryTests: [test]
    test:
      targets:
        - OurMemoryTests
